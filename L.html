<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Academy - Educational Audio Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #3f37c9;
            --accent: #4895ef;
            --danger: #f72585;
            --success: #4cc9f0;
            --warning: #f8961e;
            --light: #f8f9fa;
            --dark: #212529;
            --gradient-header: linear-gradient(135deg, #1a1a1a 0%, #333 100%);
            --radius-md: 12px;
            --shadow-medium: 0 8px 24px rgba(0,0,0,0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui;
        }

        body {
            background: var(--light);
            color: var(--dark);
        }

        .header {
            background: var(--gradient-header);
            padding: 1.5rem;
            box-shadow: var(--shadow-medium);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #fff;
            font-size: 2rem;
            font-weight: 700;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .audio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 1rem;
        }

        .audio-card {
            background: white;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-medium);
            transition: var(--transition);
        }

        .audio-card:hover {
            transform: translateY(-5px);
        }

        .audio-cover {
            height: 200px;
            background: #f0f0f0;
            position: relative;
        }

        .audio-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: var(--accent);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .audio-content {
            padding: 1.5rem;
        }

        .audio-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .audio-meta {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 0.9rem;
        }

        .card-actions {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius-md);
            width: 500px;
            max-width: 95%;
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #eee;
            border-radius: 8px;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">Audio Academy</div>
            <button class="btn btn-primary" id="addAudio">
                <i class="fas fa-plus"></i> Add Audio
            </button>
        </div>
    </header>

    <main class="container">
        <div class="audio-grid" id="audioContainer">
            <!-- Audio cards will be inserted here -->
        </div>
    </main>

    <!-- CRUD Modal -->
    <div class="modal" id="audioModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 1.5rem;" id="modalTitle">Add New Audio</h2>
            <form id="audioForm">
                <div class="form-group">
                    <label>Audio Title</label>
                    <input type="text" class="form-control" id="audioTitle" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select class="form-control" id="audioCategory" required>
                        <option>Language</option>
                        <option>Science</option>
                        <option>History</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Duration (minutes)</label>
                    <input type="number" class="form-control" id="audioDuration" required>
                </div>
                <div class="form-group" style="margin-top: 1.5rem; display: flex; gap: 0.5rem;">
                    <button type="button" class="btn btn-danger" id="modalClose">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let audioLibrary = JSON.parse(localStorage.getItem('audioLibrary')) || [];
        let currentEditId = null;

        // Initialize
        renderAudioLibrary();

        // Event Listeners
        document.getElementById('addAudio').addEventListener('click', () => openModal());
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('audioForm').addEventListener('submit', handleSubmit);

        function openModal(id = null) {
            currentEditId = id;
            if(id) {
                const audio = audioLibrary.find(a => a.id === id);
                document.getElementById('audioTitle').value = audio.title;
                document.getElementById('audioCategory').value = audio.category;
                document.getElementById('audioDuration').value = audio.duration;
                document.getElementById('modalTitle').textContent = 'Edit Audio';
            }
            document.getElementById('audioModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('audioModal').style.display = 'none';
            document.getElementById('audioForm').reset();
            currentEditId = null;
        }

        function handleSubmit(e) {
            e.preventDefault();
            const audioData = {
                id: currentEditId || Date.now(),
                title: document.getElementById('audioTitle').value,
                category: document.getElementById('audioCategory').value,
                duration: document.getElementById('audioDuration').value,
                timestamp: new Date().toISOString()
            };

            if(currentEditId) {
                const index = audioLibrary.findIndex(a => a.id === currentEditId);
                audioLibrary[index] = audioData;
            } else {
                audioLibrary.push(audioData);
            }

            localStorage.setItem('audioLibrary', JSON.stringify(audioLibrary));
            renderAudioLibrary();
            closeModal();
        }

        function renderAudioLibrary() {
            const container = document.getElementById('audioContainer');
            container.innerHTML = audioLibrary.map(audio => `
                <div class="audio-card">
                    <div class="audio-cover">
                        <div class="audio-badge">${audio.category}</div>
                    </div>
                    <div class="audio-content">
                        <h3 class="audio-title">${audio.title}</h3>
                        <div class="audio-meta">
                            <span>${audio.duration} mins</span>
                            <span>${new Date(audio.timestamp).toLocaleDateString()}</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-primary" onclick="openModal(${audio.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn btn-danger" onclick="deleteAudio(${audio.id})">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function deleteAudio(id) {
            if(confirm('Are you sure you want to delete this audio?')) {
                audioLibrary = audioLibrary.filter(a => a.id !== id);
                localStorage.setItem('audioLibrary', JSON.stringify(audioLibrary));
                renderAudioLibrary();
            }
        }
    </script>
</body>
</html>
