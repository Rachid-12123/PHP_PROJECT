<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Monde Éducatif</title>
    <style>
        :root {
            --couleur-primaire: #4CAF50;
            --couleur-secondaire: #FFC107;
            --police: 'Comic Sans MS', cursive, sans-serif;
        }
        
        body {
            font-family: var(--police);
            background-color: #f0f9ff;
            margin: 0;
            padding: 0;
        }
        
        header {
            background: linear-gradient(135deg, var(--couleur-primaire), var(--couleur-secondaire));
            color: white;
            text-align: center;
            padding: 1rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }
        
        .carte-texte {
            background: white;
            border-radius: 15px;
            width: 300px;
            padding: 20px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .carte-texte:hover {
            transform: translateY(-10px);
        }
        
        .carte-texte h2 {
            color: var(--couleur-primaire);
            border-bottom: 2px dashed var(--couleur-secondaire);
            padding-bottom: 10px;
        }
        
        .carte-texte p {
            line-height: 1.6;
        }
        
        .icone {
            font-size: 2rem;
            margin-bottom: 10px;
            display: block;
        }
        
        .bouton-interactif {
            background-color: var(--couleur-primaire);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
            font-family: var(--police);
        }
        
        .cache {
            display: none;
            background: #FFF9C4;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--couleur-primaire);
            color: white;
        }

        .formulaire-crud {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .formulaire-crud h2 {
            color: var(--couleur-primaire);
            text-align: center;
        }

        .formulaire-crud label {
            display: block;
            margin-top: 10px;
        }

        .formulaire-crud input,
        .formulaire-crud textarea,
        .formulaire-crud select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: var(--police);
        }

        .formulaire-crud button {
            background-color: var(--couleur-primaire);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            font-family: var(--police);
            display: block;
            width: 100%;
        }

        .actions-crud {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .actions-crud button {
            flex: 1;
        }

        .supprimer {
            background-color: #f44336 !important;
        }

        .modifier {
            background-color: #2196F3 !important;
        }
        
        @media (max-width: 600px) {
            .carte-texte {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🌍 Mon Monde Éducatif</h1>
        <p>Découvre des choses passionnantes !</p>
    </header>

    <div class="formulaire-crud">
        <h2>Gérer les textes éducatifs</h2>
        <form id="form-texte">
            <input type="hidden" id="texte-id">
            <label for="texte-icone">Icône:</label>
            <input type="text" id="texte-icone" required>
            
            <label for="texte-titre">Titre:</label>
            <input type="text" id="texte-titre" required>
            
            <label for="texte-contenu">Contenu:</label>
            <textarea id="texte-contenu" rows="4" required></textarea>
            
            <label for="texte-interactif">Contenu interactif (optionnel):</label>
            <textarea id="texte-interactif" rows="2"></textarea>
            
            <button type="submit" id="btn-ajouter">Ajouter un texte</button>
            <button type="button" id="btn-annuler" style="display: none; background-color: #9E9E9E;">Annuler</button>
        </form>
    </div>
    
    <div class="container" id="textes-container"></div>
    
    <footer>
        <p>© 2023 Site Éducatif pour Enfants</p>
    </footer>

    <script>
        let textesEducatifs = [
            { id: 1, titre: "L'importance de l'eau", icone: "💧", contenu: "Sans eau, rien ne pourrait vivre ! Les humains boivent de l'eau comme une voiture a besoin d'essence. Les plantes s'hydratent par leurs racines comme avec une paille. Les animaux trouvent de l'eau dans les rivières ou la rosée du matin.", interactif: "Astuce : Ferme le robinet quand tu te brosses les dents → Tu économises 12 bouteilles d'eau !" },
            { id: 2, titre: "Le respect", icone: "🤝", contenu: "Le respect, c'est comme un sourire invisible qu'on offre aux autres : Écouter sans couper la parole. Aider sans attendre de récompense. Dire 'merci' et 's'il te plaît'.", interactif: "Exemple : Si ton ami aime le violet alors que tu préfères le bleu, respecte son choix !" },
            { id: 3, titre: "La nature est notre amie", icone: "🌳", contenu: "La nature est comme une maison géante : Les arbres aspirent le mauvais air et soufflent de l'air pur. Les fleurs sont les décorations de la Terre. Les animaux sont nos voisins.", interactif: "Règle d'or : Jette tes déchets à la poubelle, comme tu ranges tes jouets !" },
            { id: 4, titre: "Pourquoi lire des livres ?", icone: "📖", contenu: "Un livre est une machine à voyager sans bouger : Tu peux explorer l'Afrique ou l'espace en tournant les pages. Les mots sont comme des muscles : plus tu lis, plus ton cerveau devient fort !", interactif: "Défi : Lis 10 minutes chaque soir avant de dormir." },
            { id: 5, titre: "Manger sainement", icone: "🍎", contenu: "Ton corps est comme une voiture de course : Essence premium : Fruits/légumes (énergie longue durée). Carburant normal : Pain/fromage (énergie moyenne). Sucreries : Comme l'essence bas de gamme (un peu, pas trop !).", interactif: "Astuce : Dessine un arc-en-ciel dans ton assiette avec des aliments de couleurs différentes !" },
            { id: 6, titre: "Le cycle de l'eau", icone: "🌧️", contenu: "L'eau joue à saute-mouton : 1. Évaporation : Le soleil fait sauter les gouttes vers le ciel. 2. Nuages : Les gouttes s'agglutinent comme des moutons. 3. Pluie : Quand le nuage est trop lourd... Splash !", interactif: "Expérience : Mets de l'eau chaude dans un bocal, couvre avec de la glace → 'pluie' instantanée !" },
            { id: 7, titre: "L'amitié", icone: "👫", contenu: "Un ami, c'est : Un coéquipier pour la vie. Un oreiller pour pleurer si besoin. Un miroir qui te montre le meilleur de toi.", interactif: "Petit geste : Offre un dessin ou un compliment gratuit à un ami aujourd'hui !" },
            { id: 8, titre: "La journée d'un écolier", icone: "🎒", contenu: "Routine magique : Matin : Petit-déjeuner = Carburant pour le cerveau. École : Apprendre, c'est comme collectionner des pièces d'or dans un jeu vidéo. Soir : Dormir tôt = Recharger ses batteries comme un téléphone !", interactif: "" },
            { id: 9, titre: "Les animaux de la ferme", icone: "🐄", contenu: "Une ferme est une usine naturelle : Vache : Transforme l'herbe en lait (magie blanche !). Poule : Pond des œufs = Cadeaux quotidiens. Abeilles : Fabriquent du miel avec des baisers de fleurs.", interactif: "Question : Quel est ton animal de ferme préféré et pourquoi ?" },
            { id: 10, titre: "Les quatre saisons", icone: "🌸☀️🍂❄️", contenu: "La Terre change de costume 4 fois par an : Printemps : Robe à fleurs. Été : Maillot de plage. Automne : Manteau orange et marron. Hiver : Pyjama blanc en duvet.", interactif: "Jeu : Dessine un arbre en 4 cases avec ses différentes tenues !" }
        ];

        const form = document.getElementById('form-texte');
        const btnAjouter = document.getElementById('btn-ajouter');
        const btnAnnuler = document.getElementById('btn-annuler');
        const champId = document.getElementById('texte-id');
        const champIcone = document.getElementById('texte-icone');
        const champTitre = document.getElementById('texte-titre');
        const champContenu = document.getElementById('texte-contenu');
        const champInteractif = document.getElementById('texte-interactif');
        const container = document.getElementById('textes-container');

        let modeEdition = null;

        function genererId() {
            return Math.max(0, ...textesEducatifs.map(t => t.id)) + 1;
        }

        function afficherTextes() {
            container.innerHTML = '';
            
            textesEducatifs.forEach((texte) => {
                const carte = document.createElement('div');
                carte.className = 'carte-texte';
                carte.dataset.id = texte.id;
                carte.innerHTML = `
                    <span class="icone">${texte.icone}</span>
                    <h2>${texte.titre}</h2>
                    <p>${texte.contenu}</p>
                    ${texte.interactif ? `
                        <button class="bouton-interactif" onclick="afficherCache(${texte.id})">Voir plus</button>
                        <div class="cache" id="cache-${texte.id}">${texte.interactif}</div>
                    ` : ''}
                    <div class="actions-crud">
                        <button class="bouton-interactif modifier" onclick="editerTexte(${texte.id})">Modifier</button>
                        <button class="bouton-interactif supprimer" onclick="supprimerTexte(${texte.id})">Supprimer</button>
                    </div>
                `;
                container.appendChild(carte);
            });
        }

        window.afficherCache = function(id) {
            const cache = document.getElementById(`cache-${id}`);
            if (cache.style.display === 'block') {
                cache.style.display = 'none';
            } else {
                cache.style.display = 'block';
            }
        }

        window.editerTexte = function(id) {
            const texte = textesEducatifs.find(t => t.id === id);
            if (texte) {
                modeEdition = id;
                champId.value = texte.id;
                champIcone.value = texte.icone;
                champTitre.value = texte.titre;
                champContenu.value = texte.contenu;
                champInteractif.value = texte.interactif || '';
                
                btnAjouter.textContent = 'Mettre à jour';
                btnAnnuler.style.display = 'block';
                form.scrollIntoView({ behavior: 'smooth' });
            }
        }

        window.supprimerTexte = function(id) {
            if (confirm('Voulez-vous vraiment supprimer ce texte ?')) {
                textesEducatifs = textesEducatifs.filter(t => t.id !== id);
                afficherTextes();
                if (modeEdition === id) annulerEdition();
            }
        }

        btnAnnuler.addEventListener('click', annulerEdition);
        
        function annulerEdition() {
            modeEdition = null;
            form.reset();
            btnAjouter.textContent = 'Ajouter un texte';
            btnAnnuler.style.display = 'none';
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const texte = {
                id: modeEdition || genererId(),
                icone: champIcone.value,
                titre: champTitre.value,
                contenu: champContenu.value,
                interactif: champInteractif.value
            };
            
            if (modeEdition) {
                const index = textesEducatifs.findIndex(t => t.id === modeEdition);
                if (index !== -1) textesEducatifs[index] = texte;
            } else {
                textesEducatifs.push(texte);
            }
            
            afficherTextes();
            annulerEdition();
        });

        afficherTextes();
    </script>
</body>
</html>
